<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>아이콘 색 실험실</title>
    <style>
      :root {
        --bg: #f7f6f3;
        --surface: #fdfcfa;
        --text: #1d1c1a;
        --sub: #77736c;
        --line: #e6e3dd;
        --accent: #4f6f9a;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 24px;
        max-width: 1100px;
        min-height: 100dvh;
        margin: 0 auto;
        padding: 24px;
      }
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .hero {
        width: min(320px, 70vw);
        aspect-ratio: 1;
        border-radius: 22.5%;
        overflow: hidden;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.14);
      }
      .hero svg,
      .mini svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .previews {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
      }
      .home {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        border-radius: 20px;
      }
      .home.light {
        background: linear-gradient(135deg, #e9e4dc, #d8dfe8);
      }
      .home.dark {
        background: linear-gradient(135deg, #1f2430, #2b2230);
      }
      .mini {
        overflow: hidden;
        box-shadow: 0 2px 6px rgb(0 0 0 / 0.2);
      }
      .mini.squircle {
        border-radius: 22.5%;
      }
      .mini.circle {
        border-radius: 50%;
      }
      .panel {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 20px;
        border-radius: 20px;
        background: var(--surface);
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      .hint {
        margin: -10px 0 0;
        color: var(--sub);
        font-size: 13px;
      }
      .group-title {
        margin: 0 0 8px;
        color: var(--sub);
        font-size: 13px;
        font-weight: 700;
      }
      .presets {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .preset {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      .preset:active {
        transform: scale(0.96);
      }
      .preset .dot {
        flex: none;
        width: 22px;
        height: 22px;
        border-radius: 7px;
      }
      #parts {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .part {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .part-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 15px;
        font-weight: 700;
      }
      .part-head label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--sub);
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .hex {
        padding: 6px 8px;
        border: 0;
        border-radius: 8px;
        background: #f1efea;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
      }
      .hex::after {
        content: ' 복사';
        color: var(--sub);
        font-weight: 600;
      }
      .hex.is-copied::after {
        content: ' ✓';
        color: var(--accent);
      }
      input[type='color'] {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: none;
        cursor: pointer;
      }
      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .swatch {
        width: 30px;
        height: 30px;
        border: 2px solid transparent;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08);
        cursor: pointer;
        transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      .swatch:active {
        transform: scale(0.9);
      }
      .swatch[aria-pressed='true'] {
        border-color: var(--text);
      }
      .result {
        display: flex;
        gap: 8px;
      }
      .result code {
        flex: 1;
        padding: 10px 12px;
        border-radius: 10px;
        background: #f1efea;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre;
        overflow-x: auto;
      }
      .button {
        align-self: stretch;
        padding: 0 14px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
          padding: 16px;
        }
        .stage {
          padding-top: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="stage" aria-label="미리보기">
        <div class="hero" id="hero"></div>
        <div class="previews">
          <div class="home light" id="light"></div>
          <div class="home dark" id="dark"></div>
        </div>
      </section>

      <section class="panel" aria-label="색 고르기">
        <h1>아이콘 색 실험실</h1>
        <p class="hint">조합을 고르거나 부분마다 색을 바꿔 보세요. 마지막 색은 이 기기에 기억돼요.</p>

        <div>
          <p class="group-title">추천 조합</p>
          <div class="presets" id="presets"></div>
        </div>

        <div id="parts"></div>

        <div>
          <p class="group-title">지금 색 전체 (복사해서 알려 주세요)</p>
          <div class="result">
            <code id="result"></code>
            <button type="button" class="button" id="copy">복사</button>
          </div>
        </div>
      </section>
    </main>

    <script>
      const PARTS = [
        { key: 'band', label: '위쪽 띠', swatches: ['#DCE5F1', '#E8EEF6', '#C9D6E8', '#4F6F9A', '#F3E3DF', '#E3EDE4', '#EFE7D6', '#E6E1F2', '#1D1C1A'] },
        { key: 'ring', label: '고리', swatches: ['#4F6F9A', '#3F5D88', '#6A8CBB', '#1D1C1A', '#E9867B', '#5B8C6A', '#C8963E', '#7B68B0', '#FFFFFF'] },
        { key: 'won', label: '₩ 기호', swatches: ['#4F6F9A', '#3F5D88', '#1D1C1A', '#E9867B', '#D9705F', '#5B8C6A', '#C8963E', '#7B68B0', '#2F80ED'] },
        { key: 'paper', label: '바탕', swatches: ['#FFFFFF', '#F7F6F3', '#FBF8F2', '#F4F7FB', '#1D1C1A', '#22262E'] },
      ]

      const PRESETS = [
        { name: '지금', band: '#DCE5F1', ring: '#4F6F9A', won: '#4F6F9A', paper: '#FFFFFF' },
        { name: '진한 파랑', band: '#4F6F9A', ring: '#3F5D88', won: '#4F6F9A', paper: '#FFFFFF' },
        { name: '코랄', band: '#F3E3DF', ring: '#E9867B', won: '#E9867B', paper: '#FFFFFF' },
        { name: '초록', band: '#E3EDE4', ring: '#5B8C6A', won: '#5B8C6A', paper: '#FFFFFF' },
        { name: '꿀', band: '#EFE7D6', ring: '#C8963E', won: '#C8963E', paper: '#FFFFFF' },
        { name: '보라', band: '#E6E1F2', ring: '#7B68B0', won: '#7B68B0', paper: '#FFFFFF' },
        { name: '먹색', band: '#E9E6E1', ring: '#1D1C1A', won: '#1D1C1A', paper: '#FFFFFF' },
        { name: '파랑+코랄', band: '#DCE5F1', ring: '#4F6F9A', won: '#E9867B', paper: '#FFFFFF' },
        { name: '다크', band: '#2B3442', ring: '#86A3CC', won: '#86A3CC', paper: '#1D1C1A' },
      ]

      const STORAGE_KEY = 'icon-lab.colors'
      const loadColors = () => {
        try {
          return { ...PRESETS[0], ...JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') }
        } catch {
          return { ...PRESETS[0] }
        }
      }
      const saveColors = colors => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(colors))
        } catch {}
      }

      let colors = loadColors()

      // 띠 아래 경계선은 띠 색보다 조금 어둡게 자동으로 만든다.
      const darken = (hex, amount) => {
        const value = parseInt(hex.slice(1), 16)
        const channel = shift => Math.max(0, Math.round(((value >> shift) & 255) * (1 - amount)))
        return `#${[16, 8, 0].map(channel).map(part => part.toString(16).padStart(2, '0')).join('')}`
      }

      // 실제 앱 아이콘과 같은 모양: 안드로이드가 보여 주는 가운데 684px 영역.
      const iconSvg = ({ band, ring, won, paper }) => {
        const s = 120
        const h = s * 0.95
        const cx = 512
        const cy = 612
        const w = [
          [cx - s, cy - h],
          [cx - s * 0.5, cy + h],
          [cx, cy - h * 0.35],
          [cx + s * 0.5, cy + h],
          [cx + s, cy - h],
        ]
          .map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`)
          .join(' L')
        const bars = [-h * 0.12, h * 0.3]
          .map(dy => `<line x1="${cx - s * 1.18}" y1="${cy + dy}" x2="${cx + s * 1.18}" y2="${cy + dy}" stroke="${won}" stroke-width="32" stroke-linecap="round"/>`)
          .join('')
        const rings = [372, 652]
          .map(x => `<circle cx="${x}" cy="372" r="30" fill="${paper}"/><rect x="${x - 18}" y="294" width="36" height="98" rx="18" fill="${ring}"/>`)
          .join('')
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="170 170 684 684">
          <rect width="1024" height="1024" fill="${paper}"/>
          <rect width="1024" height="372" fill="${band}"/>
          <rect y="366" width="1024" height="6" fill="${darken(band, 0.08)}"/>
          ${rings}
          <path d="M${w}" fill="none" stroke="${won}" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
          ${bars}
        </svg>`
      }

      const miniSet = svg =>
        [
          ['squircle', 60],
          ['circle', 60],
          ['squircle', 44],
          ['circle', 32],
        ]
          .map(([shape, size]) => `<div class="mini ${shape}" style="width:${size}px;height:${size}px">${svg}</div>`)
          .join('')

      const render = () => {
        const svg = iconSvg(colors)
        document.getElementById('hero').innerHTML = svg
        document.getElementById('light').innerHTML = miniSet(svg)
        document.getElementById('dark').innerHTML = miniSet(svg)
        document.getElementById('result').textContent = PARTS.map(part => `${part.label}: ${colors[part.key].toUpperCase()}`).join('\n')
        PARTS.forEach(part => {
          document.getElementById(`picker-${part.key}`).value = colors[part.key].toLowerCase()
          document.getElementById(`code-${part.key}`).textContent = colors[part.key].toUpperCase()
          document.querySelectorAll(`[data-part="${part.key}"]`).forEach(button => {
            button.setAttribute('aria-pressed', String(button.dataset.color.toLowerCase() === colors[part.key].toLowerCase()))
          })
        })
        saveColors(colors)
      }

      const setColor = (key, value) => {
        colors = { ...colors, [key]: value }
        render()
      }

      document.getElementById('presets').innerHTML = PRESETS.map(
        (preset, index) =>
          `<button type="button" class="preset" data-preset="${index}"><span class="dot" style="background:linear-gradient(135deg, ${preset.band} 50%, ${preset.won} 50%)"></span>${preset.name}</button>`,
      ).join('')

      document.getElementById('parts').innerHTML = PARTS.map(
        part => `<div class="part">
          <div class="part-head">${part.label}
            <label><button type="button" class="hex" id="code-${part.key}" data-copy="${part.key}" aria-label="${part.label} 색상값 복사"></button><input type="color" id="picker-${part.key}" aria-label="${part.label} 직접 고르기" /></label>
          </div>
          <div class="swatches">${part.swatches
            .map(color => `<button type="button" class="swatch" data-part="${part.key}" data-color="${color}" style="background:${color}" aria-label="${part.label} ${color}"></button>`)
            .join('')}</div>
        </div>`,
      ).join('')

      const copyText = async text => {
        try {
          await navigator.clipboard.writeText(text)
          return true
        } catch {
          return false
        }
      }

      document.addEventListener('click', async event => {
        const hex = event.target.closest('[data-copy]')
        if (hex) {
          if (await copyText(colors[hex.dataset.copy].toUpperCase())) {
            hex.classList.add('is-copied')
            setTimeout(() => hex.classList.remove('is-copied'), 1200)
          }
          return
        }
        const swatch = event.target.closest('[data-part]')
        if (swatch) setColor(swatch.dataset.part, swatch.dataset.color)
        const preset = event.target.closest('[data-preset]')
        if (preset) {
          const { name, ...picked } = PRESETS[Number(preset.dataset.preset)]
          colors = picked
          render()
        }
      })

      PARTS.forEach(part => {
        document.getElementById(`picker-${part.key}`).addEventListener('input', event => setColor(part.key, event.target.value))
      })

      document.getElementById('copy').addEventListener('click', async event => {
        const button = event.currentTarget
        button.textContent = (await copyText(document.getElementById('result').textContent)) ? '복사됨' : '길게 눌러 복사'
        setTimeout(() => (button.textContent = '복사'), 1500)
      })

      render()
    </script>
  </body>
</html>
