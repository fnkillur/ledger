<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="가뿌까" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)" />
    <title>가뿌까</title>
    <style>
      /* 앱이 그려지기 전에 바로 보이는 시작 화면. 시스템 시작 화면과 같은 바탕색으로 이어 준다. */
      /* 안드로이드(삼성) 시스템 시작 화면과 겹쳐 보이도록, 폰에서 잰 것과 같은 크기(156dp)·모양(모서리 25.6%)으로 화면 정가운데에 둔다. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #f7f6f3;
        transition: opacity 280ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      #boot-splash.is-hiding {
        opacity: 0;
      }
      .boot-splash-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 156px;
        height: 156px;
        transform: translate(-50%, -50%);
        clip-path: inset(0 round 25.6%);
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash {
          background: #161615;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <svg class="boot-splash-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="170 170 684 684"><rect width="1024" height="1024" fill="#FFFFFF"/><rect width="1024" height="372" fill="#DCE5F1"/><rect y="366" width="1024" height="6" fill="#C5D3E6"/><circle cx="372" cy="372" r="30" fill="#FFFFFF"/><rect x="354" y="294" width="36" height="98" rx="18" fill="#4F6F9A"/><circle cx="652" cy="372" r="30" fill="#FFFFFF"/><rect x="634" y="294" width="36" height="98" rx="18" fill="#4F6F9A"/><path d="M392.0 498.0 L452.0 726.0 L512.0 572.1 L572.0 726.0 L632.0 498.0" fill="none" stroke="#4F6F9A" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/><line x1="370.4" y1="598.3" x2="653.6" y2="598.3" stroke="#4F6F9A" stroke-width="32.2" stroke-linecap="round"/><line x1="370.4" y1="646.2" x2="653.6" y2="646.2" stroke="#4F6F9A" stroke-width="32.2" stroke-linecap="round"/></svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
